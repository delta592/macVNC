name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Build Dependencies
        run: |
          brew install libvncserver openssl ninja ccache
      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DMACVNC_UNIVERSAL=OFF \
            -DMACVNC_BUILD_TESTS=ON
          cmake --build build
          cmake --install build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  coverage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Build Dependencies
        run: |
          brew install libvncserver openssl ninja
      - name: Build with coverage
        run: |
          cmake -S . -B build -G Ninja \
            -DMACVNC_UNIVERSAL=OFF \
            -DMACVNC_ENABLE_COVERAGE=ON \
            -DMACVNC_BUILD_TESTS=ON
          cmake --build build
      - name: Test + coverage report
        run: |
          ctest --test-dir build --output-on-failure
          ./scripts/coverage-report.sh build
      # - name: Upload lcov artifact
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      #   with:
      #     name: coverage-lcov
      #     path: build/coverage.lcov
      # Uploads when CODECOV_TOKEN is configured as a repo secret.
      # secrets.* is not allowed in steps.if; map to env first.
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: build/coverage.lcov
          fail_ci_if_error: false

  format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install clang-format
        run: brew install clang-format
      - name: Check formatting
        run: make format-check
