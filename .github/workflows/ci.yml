name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ccache
        run: brew install ccache
      - name: Build dependencies from source
        run: ./scripts/build-deps.sh --arch="$(uname -m)"
      - name: Build
        run: |
          cmake -S . -B build \
            -DMACVNC_UNIVERSAL=OFF \
            -DMACVNC_BUILD_TESTS=ON \
            -DMACVNC_DEPS_PREFIX="$PWD/deps/prefix/$(uname -m)"
          cmake --build build
          cmake --install build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  coverage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ccache
        run: brew install ccache
      - name: Build dependencies from source
        run: ./scripts/build-deps.sh --arch="$(uname -m)"
      - name: Build with coverage
        run: |
          cmake -S . -B build \
            -DMACVNC_UNIVERSAL=OFF \
            -DMACVNC_ENABLE_COVERAGE=ON \
            -DMACVNC_BUILD_TESTS=ON \
            -DMACVNC_DEPS_PREFIX="$PWD/deps/prefix/$(uname -m)"
          cmake --build build
      - name: Test + coverage report
        run: |
          ctest --test-dir build --output-on-failure
          ./scripts/coverage-report.sh build
      # Uploads when CODECOV_TOKEN is configured as a repo secret.
      # secrets.* is not allowed in steps.if; map to env first.
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: build/coverage.lcov
          fail_ci_if_error: false

  format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install clang-format
        run: brew install clang-format
      - name: Check formatting
        run: make format-check
