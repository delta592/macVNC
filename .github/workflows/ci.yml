name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Build Dependencies
        run: |
          brew install libvncserver openssl
      - name: Build
        run: |
          mkdir build
          cd build
          # CI runners have single-arch Homebrew bottles
          cmake .. -DMACVNC_UNIVERSAL=OFF
          cmake --build .
          cmake --install .
      - name: Archive App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: macVNC App Bundle
          path: build/*.app
