name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Build Dependencies
        run: |
          brew install libvncserver openssl
      - name: Build
        run: |
          mkdir build
          cd build
          # CI runners have single-arch Homebrew bottles
          cmake .. -DMACVNC_UNIVERSAL=OFF
          cmake --build .
          cmake --install .
